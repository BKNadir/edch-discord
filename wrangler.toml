# EDCH-Discord as a Cloudflare Worker (Discord "interactions" bot). It keeps no data: settings and
# reports live in the channels of each Discord server it is in. Set-up: README.md (the setup
# script does all of it).
# Everything about your copy is a Worker secret, kept by Cloudflare and never in this file, so a
# deploy (from any PC) never changes it:
#   DISCORD_APPLICATION_ID   developer portal → General Information → Application ID
#   DISCORD_PUBLIC_KEY       developer portal → General Information → Public Key
#   DISCORD_BOT_TOKEN        developer portal → Bot → Reset Token
#   LINK_SECRET              any long random text: signs the keys given to EDCH (made once)
#   DISCORD_GUILD_ID         optional: your server's id, the bot then answers that server only
name = "edch-discord"
main = "src/index.ts"
compatibility_date = "2026-06-01"
